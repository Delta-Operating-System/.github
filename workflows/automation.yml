name: Build, Sign, and Publish Debian Package

# This workflow runs automatically when a version tag is pushed
on:
  push:
    tags:
      - 'v*'  # Matches v1.0.0, v2.1.3, etc.

# Permissions required for this workflow
permissions:
  contents: write          # For creating GitHub Releases and uploading assets
  pages: write             # For deploying to GitHub Pages (APT repository)
  id-token: write          # For authentication with Pages

jobs:
  # ==================== JOB 1: BUILD THE .deb PACKAGE ====================
  build-package:
    name: Build .deb Package
    runs-on: ubuntu-latest
    outputs:
      deb_name: ${{ steps.get-name.outputs.deb_name }}
      deb_path: ${{ steps.get-name.outputs.deb_path }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Build the .deb package using pakste
      - name: Build .deb package with pakste
        id: build
        uses: kakwa/pakste@main

      # Find the built .deb file and save its info
      - name: Get .deb file path and name
        id: get-name
        run: |
          DEB_FILE=$(find . -name "*.deb" -type f | head -n 1)
          DEB_NAME=$(basename "$DEB_FILE")
          echo "deb_name=$DEB_NAME" >> $GITHUB_OUTPUT
          echo "deb_path=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "Found: $DEB_NAME"

      # Upload the .deb as an artifact so other jobs can access it
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ${{ steps.get-name.outputs.deb_path }}

  # ==================== JOB 2: UPDATE THE APT REPOSITORY ====================
  update-repo:
    name: Update APT Repository
    needs: build-package
    runs-on: ubuntu-latest
    steps:
      # Checkout the APT repository (the one served via GitHub Pages)
      - name: Checkout APT repository
        uses: actions/checkout@v4
        with:
          repository: Delta-Operating-System/delta-apt
          ref: gh-pages
          path: apt-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      # Download the .deb built in the previous job
      - name: Download .deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: ./apt-repo/pool/main/

      # Import the GPG private key for signing
      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import

      # Install aptly and update the repository
      - name: Install aptly and update repository
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly
          cd apt-repo

          # Create a temporary GPG home for aptly
          export GNUPGHOME=$(mktemp -d)
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import

          # Create/update the repository
          aptly repo create -distribution=stable -component=main main 2>/dev/null || true
          aptly repo add -force-replace main ./pool/main/
          aptly publish update -force-overwrite stable main 2>/dev/null || \
            aptly publish repo -gpg-key="${{ secrets.GPG_KEY_ID }}" -passphrase="${{ secrets.GPG_PASSPHRASE }}" main stable

  # ==================== JOB 3: DEPLOY TO GITHUB PAGES ====================
  deploy-repo:
    name: Deploy to GitHub Pages
    needs: update-repo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout APT repository
        uses: actions/checkout@v4
        with:
          repository: Delta-Operating-System/delta-apt
          ref: gh-pages
          path: apt-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      # Upload the entire repository as a Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==================== JOB 4: CREATE GITHUB RELEASE ====================
  create-release:
    name: Create GitHub Release
    needs: build-package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-package

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
